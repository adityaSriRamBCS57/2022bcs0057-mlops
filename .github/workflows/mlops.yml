name: MLOps Pipeline - 2022BCS0057

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ROLL_NO: 2022BCS0057
  STUDENT_NAME: "Aditya Sri Ram"
  DOCKER_IMAGE: adityasr57/2022bcs0057-mlops

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip && pip install "pathspec<0.12"
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: DVC Pull Data
        run: |
          dvc pull
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Start MLflow Server (local)
        run: |
          mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns &
          sleep 5

      - name: Train Model & Log to MLflow
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          python train.py

      - name: Upload MLflow DB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-results
          path: |
            mlflow.db
            mlruns/
            models/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Smoke Test Container
        run: |
          docker run -d -p 8000:8000 --name test_api ${{ env.DOCKER_IMAGE }}:latest
          sleep 8
          curl -f http://localhost:8000/health
          echo ""
          curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [5.1, 3.5]}' | python3 -m json.tool
          docker stop test_api
